name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          set -e
          URL="https://taxi-appp.onrender.com/api/health"
          echo "Pinging $URL"
          curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 "$URL"
          echo
          echo "Render health check completed."
