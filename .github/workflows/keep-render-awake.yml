name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render and check health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://taxi-appp.onrender.com/api/health"
          echo "Checking $URL"
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 45 \
            --retry 10 \
            --retry-delay 10 \
            --retry-max-time 180 \
            --retry-all-errors \
            "$URL"
          echo
          echo "Render health check completed successfully."
