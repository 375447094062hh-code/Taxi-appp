name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -e
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret is not configured"
            exit 1
          fi
          URL="${RENDER_URL%/}/api/health"
          echo "Pinging $URL"
          curl --fail --silent --show-error --max-time 30 "$URL"
          echo
          echo "Render health check completed."
